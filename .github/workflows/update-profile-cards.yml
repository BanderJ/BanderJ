name: Actualizar tarjetas del perfil

on:
  schedule:
    - cron: "0 8 * * *"   # todos los días, 03:00 hora de Lima
  workflow_dispatch:       # permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats (oscuro)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&locale=es&rank_icon=github&bg_color=0D1117&title_color=2F81F7&text_color=C9D1D9&icon_color=2F81F7&ring_color=2F81F7"
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats (claro)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&locale=es&rank_icon=github&bg_color=FFFFFF&title_color=0969DA&text_color=1F2328&icon_color=0969DA&ring_color=0969DA"
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (oscuro)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&locale=es&bg_color=0D1117&title_color=2F81F7&text_color=C9D1D9"
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (claro)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&locale=es&bg_color=FFFFFF&title_color=0969DA&text_color=1F2328"
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak (oscuro)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&locale=es&hide_border=true&disable_animations=true&background=0D1117&stroke=30363D&ring=2F81F7&fire=2F81F7&currStreakNum=E6EDF3&sideNums=E6EDF3&currStreakLabel=2F81F7&sideLabels=8B949E&dates=8B949E"
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak (claro)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&locale=es&hide_border=true&disable_animations=true&background=FFFFFF&stroke=D0D7DE&ring=0969DA&fire=0969DA&currStreakNum=1F2328&sideNums=1F2328&currStreakLabel=0969DA&sideLabels=57606A&dates=57606A"
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?color_snake=0969DA
            profile/snake-dark.svg?palette=github-dark&color_snake=2F81F7

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: actualizar tarjetas del perfil" || exit 0
          git push
